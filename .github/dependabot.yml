version: 2
updates:
  # Keep updates separate so auto-merge can enforce a single patch update type.
  - package-ecosystem: github-actions
    # `/` covers only .github/workflows and a root action.yml; the local
    # composite action pins tree-sitter/setup-action separately.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: sunday
    commit-message:
      prefix: ci
    labels: [dependencies]
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    versioning-strategy: increase
    directory: /
    schedule:
      interval: weekly
      day: sunday
    commit-message:
      prefix: "build(deps)"
    labels: [dependencies]
    open-pull-requests-limit: 3

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: sunday
    commit-message:
      prefix: "build(deps)"
    labels: [dependencies]
    open-pull-requests-limit: 3

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: sunday
    commit-message:
      prefix: "build(deps)"
    labels: [dependencies]
    open-pull-requests-limit: 2

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: sunday
    commit-message:
      prefix: "build(deps)"
    labels: [dependencies]
    open-pull-requests-limit: 2

  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
      day: sunday
    commit-message:
      prefix: "build(deps)"
    labels: [dependencies]
    open-pull-requests-limit: 2
