name: Fuzz

on:
  workflow_dispatch:
  pull_request:
    paths:
      - grammar.js
      - tree-sitter.json
      - package.json
      - package-lock.json
      - scripts/fuzz.mjs
      - src/**
      - test/corpus/**
      - .github/actions/setup-tree-sitter/**
      - .github/workflows/fuzz.yml
  push:
    branches: [main]
    paths:
      - grammar.js
      - tree-sitter.json
      - package.json
      - package-lock.json
      - scripts/fuzz.mjs
      - src/**
      - test/corpus/**
      - .github/actions/setup-tree-sitter/**
      - .github/workflows/fuzz.yml

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Hosted runners force JavaScript actions to Node 24 starting 2026-06-16.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  fuzz:
    name: Fuzz parser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up tree-sitter
        uses: ./.github/actions/setup-tree-sitter

      - name: Fuzz parser
        run: npm run fuzz
