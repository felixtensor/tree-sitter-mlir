name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Hosted runners force JavaScript actions to Node 24 starting 2026-06-16.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test parser
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up tree-sitter
        uses: ./.github/actions/setup-tree-sitter

      - name: Run parser tests
        uses: tree-sitter/parser-test-action@v3
        with:
          test-rust: true
          test-node: false
          test-python: true
          test-go: true
          go-version: "1.23"
          test-swift: false
          test-zig: false

      # Required integration corpus: examples must parse without ERROR nodes.
      - name: Parse examples
        uses: tree-sitter/parse-action@v5
        id: parse-files
        with:
          files: examples/**/*.mlir

      - name: Upload parse failures
        if: ${{ failure() && steps.parse-files.outputs.failures != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: parse-failures-${{matrix.os}}
          path: ${{steps.parse-files.outputs.failures}}
          retention-days: 7

  # Regenerate parser artifacts and fail if committed files are stale.
  generated:
    name: Check generated files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up tree-sitter
        uses: ./.github/actions/setup-tree-sitter

      - name: Verify committed parser is up to date
        run: |
          set -euo pipefail

          tree-sitter generate

          if [ -z "$(git status --porcelain)" ]; then
            echo "Generated files are up to date."
            exit 0
          fi

          echo "::error::Generated files are out of date. Run 'tree-sitter generate' and commit the result."
          git status --short
          echo ""
          git --no-pager diff --no-ext-diff
          exit 1

      # Errors-only: every shipped query must compile against the grammar,
      # tags.scm must validate under tree-sitter-tags, and highlights.scm may
      # only use standard captures plus the documented editor extensions.
      - name: Check queries compile and validate
        run: |
          set -euo pipefail
          example="$(find examples -name '*.mlir' -print -quit)"
          for query in queries/*.scm; do
            echo "Compiling ${query}"
            tree-sitter query "${query}" "${example}" >/dev/null
          done

          echo "Validating tags query"
          tags_output="$(tree-sitter tags test/highlight/integration/linalg.mlir)"
          printf '%s\n' "${tags_output}" | grep -q '@depthwise_conv_1d_nwc_wcm'
          if printf '%s\n' "${tags_output}" | grep -q '\^bb'; then
            echo "::error::Unexpected block label tag in tree-sitter tags output"
            exit 1
          fi

          echo "Validating highlight capture vocabulary"
          check_stderr="$(tree-sitter highlight --check test/highlight/integration/linalg.mlir --query-paths queries/highlights.scm 2>&1 >/dev/null)"
          unexpected="$(printf '%s\n' "${check_stderr}" | grep -E '^\* ' | grep -Ev '^\* (variable\.special|label)$' || true)"
          if [ -n "${unexpected}" ]; then
            echo "::error::Unexpected non-standard highlight captures detected:"
            printf '%s\n' "${unexpected}"
            exit 1
          fi

          echo "Smoke-testing folds and indents query captures"
          folds_output="$(tree-sitter query queries/folds.scm test/highlight/attributes/metadata.mlir)"
          printf '%s\n' "${folds_output}" | grep -q 'pattern: 0'
          printf '%s\n' "${folds_output}" | grep -q 'pattern: 1'
          indents_output="$(tree-sitter query queries/indents.scm test/highlight/core/controlflow.mlir)"
          for cap in indent.begin indent.branch indent.end indent.ignore; do
            printf '%s\n' "${indents_output}" | grep -q "${cap},"
          done
